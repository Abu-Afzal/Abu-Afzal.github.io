<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinSync Family</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .tab-active { background: #2563eb; color: white; }
        .tab-inactive { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body class="p-4">
    <div class="glass-card rounded-3xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center">
                <span class="text-3xl">💰</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">FinSync Family</h1>
            <p class="text-sm text-slate-500 mt-1">Kelola Titipan Dana Keluarga</p>
        </div>

        <div class="flex gap-2 mb-6">
            <button onclick="switchTab('login')" id="tab-login" class="tab-active flex-1 py-3 rounded-xl font-bold text-sm transition-all">Masuk</button>
            <button onclick="switchTab('register')" id="tab-register" class="tab-inactive flex-1 py-3 rounded-xl font-bold text-sm transition-all">Daftar</button>
        </div>

        <!-- Form Login -->
        <form id="form-login" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Email</label>
                <input type="email" id="login-email" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Password</label>
                <input type="password" id="login-password" required minlength="6" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">Masuk</button>
        </form>

        <!-- Form Register -->
        <form id="form-register" class="space-y-4 hidden">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Nama Lengkap</label>
                <input type="text" id="register-name" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Email</label>
                <input type="email" id="register-email" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Password (min. 6 karakter)</label>
                <input type="password" id="register-password" required minlength="6" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">Daftar Akun</button>
        </form>

        <div id="error-message" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm text-center"></div>
        <div id="success-message" class="hidden mt-4 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-600 text-sm text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2rhK8et5UvZ5IEKRy21qjk3gRhc9-FUU",
            authDomain: "finsync-family.firebaseapp.com",
            projectId: "finsync-family",
            storageBucket: "finsync-family.firebasestorage.app",
            messagingSenderId: "363860293467",
            appId: "1:363860293467:web:81947477674fdeaa514c7e",
            databaseURL: "https://finsync-family-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.switchTab = (tab) => {
            document.getElementById('tab-login').className = tab === 'login' ? 'tab-active flex-1 py-3 rounded-xl font-bold text-sm transition-all' : 'tab-inactive flex-1 py-3 rounded-xl font-bold text-sm transition-all';
            document.getElementById('tab-register').className = tab === 'register' ? 'tab-active flex-1 py-3 rounded-xl font-bold text-sm transition-all' : 'tab-inactive flex-1 py-3 rounded-xl font-bold text-sm transition-all';
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
            hideMessages();
        };

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg; el.classList.remove('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }
        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg; el.classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
        }
        function hideMessages() {
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value.trim(), document.getElementById('login-password').value);
                window.location.href = 'notefinansial.html'; // Redirect ke dashboard
            } catch (error) {
                let msg = 'Login gagal.';
                if (error.code === 'auth/user-not-found') msg = 'Email tidak terdaftar.';
                else if (error.code === 'auth/wrong-password') msg = 'Password salah.';
                showError(msg);
            }
        });

        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, document.getElementById('register-email').value.trim(), document.getElementById('register-password').value);
                await updateProfile(userCredential.user, { displayName: document.getElementById('register-name').value.trim() });
                
                // Buat struktur data kosong untuk user baru
                await set(ref(db, `finSync/users/${userCredential.user.uid}/owners`), {});
                await set(ref(db, `finSync/users/${userCredential.user.uid}/transactions`), {});
                
                showSuccess('Akun berhasil dibuat! Silakan masuk.');
                setTimeout(() => switchTab('login'), 2000);
            } catch (error) {
                let msg = 'Pendaftaran gagal.';
                if (error.code === 'auth/email-already-in-use') msg = 'Email sudah terdaftar.';
                else if (error.code === 'auth/weak-password') msg = 'Password minimal 6 karakter.';
                showError(msg);
            }
        });
    </script>
</body>
</html>
