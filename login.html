<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinSync Family</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #ecfdf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            max-width: 480px;
            width: 100%;
            padding: 48px 40px;
        }
        
        .logo-wrapper {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #0ea5e9 0%, #14b8a6 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }
        
        .tab-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 12px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            color: #64748b;
        }
        
        .tab-btn.active {
            background: white;
            color: #0ea5e9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            background: #f8fafc;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #0ea5e9;
            background: white;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: #0ea5e9;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0ea5e9 0%, #14b8a6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }
        
        .forgot-link {
    display: block;
    text-align: right;
    color: #0ea5e9;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 8px;  /* Ubah dari -10px ke 8px */
    margin-bottom: 0;  /* Hapus margin bottom */
    cursor: pointer;
    transition: color 0.3s;
}

.forgot-link:hover {
    color: #0284c7;
    text-decoration: underline;
}

/* Pastikan message box tersembunyi default */
.message-box {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;  /* Jarak sebelum tombol */
    display: none;  /* Pastikan hidden default */
}

.message-box.error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
}

.message-box.success {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #16a34a;
}
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #94a3b8;
            font-size: 13px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        
        .divider span {
            padding: 0 12px;
        }
        
        @media (max-width: 640px) {
            .login-card {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logo & Title -->
        <div class="logo-wrapper">
            <div class="logo-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <h1 style="font-size: 28px; font-weight: 700; color: #0f172a; margin: 0 0 8px 0;">FinSync Family</h1>
            <p style="font-size: 14px; color: #64748b; margin: 0;">Kelola Titipan Dana Keluarga</p>
        </div>
        
        <!-- Tab Switcher -->
        <div id="tab-switcher" class="tab-switcher">
            <button onclick="showLogin()" id="tab-login" class="tab-btn active">Masuk</button>
            <button onclick="showRegister()" id="tab-register" class="tab-btn">Daftar</button>
        </div>
        
        <!-- Login Form -->
<form id="form-login">
    <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" required class="form-input" placeholder="nama@email.com">
    </div>
    
    <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-wrapper">
            <input type="password" id="login-password" required minlength="6" class="form-input" placeholder="Masukkan password">
            <button type="button" onclick="togglePassword('login-password', this)" class="toggle-password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
        <a onclick="showForgotPassword()" class="forgot-link">Lupa Password?</a>
    </div>
    
    <div class="remember-me">
        <input type="checkbox" id="remember-me">
        <label for="remember-me">Ingat Saya (Simpan Password)</label>
    </div>
    
    <!-- Pesan Error & Success (dipindah ke atas tombol) -->
    <div id="error-message" class="message-box error" style="display: none;"></div>
    <div id="success-message" class="message-box success" style="display: none;"></div>
    
    <button type="submit" class="btn-primary">Masuk</button>
</form>
        
        <!-- Register Form -->
        <form id="form-register" style="display: none;">
            <div class="form-group">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="register-name" required class="form-input" placeholder="Masukkan nama lengkap">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="register-email" required class="form-input" placeholder="nama@email.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password (min. 6 karakter)</label>
                <div class="password-wrapper">
                    <input type="password" id="register-password" required minlength="6" class="form-input" placeholder="Buat password kuat">
                    <button type="button" onclick="togglePassword('register-password', this)" class="toggle-password">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-primary">Daftar Akun</button>
        </form>
        
        <!-- Forgot Password Form -->
        <form id="form-forgot" style="display: none;">
            <div style="background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 16px; margin-bottom: 20px;">
                <p style="font-size: 13px; color: #0369a1; margin: 0;">📧 Masukkan email Anda, kami akan mengirimkan link untuk mengatur ulang password.</p>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="forgot-email" required class="form-input" placeholder="nama@email.com">
            </div>
            
            <button type="submit" class="btn-primary">Kirim Link Reset</button>
            <button type="button" onclick="showLogin()" style="width: 100%; padding: 12px; background: none; border: none; color: #64748b; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px;">← Kembali ke Login</button>
        </form>
        
        <!-- Messages -->
        <div id="error-message" class="message-box error"></div>
        <div id="success-message" class="message-box success"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2rhK8et5UvZ5IEKRy21qjk3gRhc9-FUU",
            authDomain: "finsync-family.firebaseapp.com",
            projectId: "finsync-family",
            storageBucket: "finsync-family.firebasestorage.app",
            messagingSenderId: "363860293467",
            appId: "1:363860293467:web:81947477674fdeaa514c7e",
            databaseURL: "https://finsync-family-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // === FITUR SIMPAN PASSWORD ===
        const REMEMBER_KEY = 'finsync_remember_me';

        function saveCredentials(email, password) {
            localStorage.setItem(REMEMBER_KEY, JSON.stringify({ email, password }));
        }

        function clearCredentials() {
            localStorage.removeItem(REMEMBER_KEY);
        }

        function loadCredentials() {
            const saved = localStorage.getItem(REMEMBER_KEY);
            if (saved) {
                try {
                    const { email, password } = JSON.parse(saved);
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').value = password;
                    document.getElementById('remember-me').checked = true;
                } catch (e) {
                    console.error('Error loading saved credentials:', e);
                }
            }
        }

        loadCredentials();
        // === END FITUR SIMPAN PASSWORD ===

        window.showLogin = () => {
            document.getElementById('form-login').style.display = 'block';
            document.getElementById('form-register').style.display = 'none';
            document.getElementById('form-forgot').style.display = 'none';
            document.getElementById('tab-switcher').style.display = 'flex';
            
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-register').classList.remove('active');
            hideMessages();
        };

        window.showRegister = () => {
            document.getElementById('form-login').style.display = 'none';
            document.getElementById('form-register').style.display = 'block';
            document.getElementById('form-forgot').style.display = 'none';
            document.getElementById('tab-switcher').style.display = 'flex';
            
            document.getElementById('tab-register').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
            hideMessages();
        };

        window.showForgotPassword = () => {
            document.getElementById('form-login').style.display = 'none';
            document.getElementById('form-register').style.display = 'none';
            document.getElementById('form-forgot').style.display = 'block';
            document.getElementById('tab-switcher').style.display = 'none';
            hideMessages();
        };

        window.togglePassword = (inputId, btn) => {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            }
        };

        function showError(msg) {
    const el = document.getElementById('error-message');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('success-message').style.display = 'none';
}

function showSuccess(msg) {
    const el = document.getElementById('success-message');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('error-message').style.display = 'none';
}

function hideMessages() {
    document.getElementById('error-message').style.display = 'none';
    document.getElementById('success-message').style.display = 'none';
}

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                
                if (rememberMe) {
                    saveCredentials(email, password);
                } else {
                    clearCredentials();
                }
                
                window.location.href = 'index.html';
            } catch (error) {
                let msg = 'Login gagal.';
                if (error.code === 'auth/user-not-found') msg = 'Email tidak terdaftar. Silakan daftar terlebih dahulu.';
                else if (error.code === 'auth/wrong-password') msg = 'Password salah. Silakan periksa kembali atau gunakan fitur Lupa Password.';
                else if (error.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                showError(msg);
            }
        });

        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            
            try {
                const email = document.getElementById('register-email').value.trim();
                const password = document.getElementById('register-password').value;
                const name = document.getElementById('register-name').value.trim();

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                
                await set(ref(db, `finSync/users/${userCredential.user.uid}/owners`), {});
                await set(ref(db, `finSync/users/${userCredential.user.uid}/transactions`), {});
                
                showSuccess('Akun berhasil dibuat! Silakan masuk.');
                setTimeout(() => showLogin(), 2500);
            } catch (error) {
                let msg = 'Pendaftaran gagal.';
                if (error.code === 'auth/email-already-in-use') msg = 'Email sudah terdaftar. Silakan gunakan email lain atau langsung login.';
                else if (error.code === 'auth/weak-password') msg = 'Password terlalu lemah. Minimal 6 karakter.';
                else if (error.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                showError(msg);
            }
        });

        document.getElementById('form-forgot').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            
            const email = document.getElementById('forgot-email').value.trim();
            
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess(`Link reset password telah dikirim ke ${email}. Silakan cek inbox atau folder spam Anda.`);
                setTimeout(() => showLogin(), 4000);
            } catch (error) {
                let msg = 'Gagal mengirim link reset.';
                if (error.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                else if (error.code === 'auth/user-not-found') msg = 'Email ini tidak terdaftar di sistem kami.';
                else if (error.code === 'auth/too-many-requests') msg = 'Terlalu banyak permintaan. Coba lagi nanti.';
                showError(msg);
            }
        });
    </script>
</body>
</html>
