<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinSync Family</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .tab-active { background: #2563eb; color: white; }
        .tab-inactive { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body class="p-4">
    <div class="glass-card rounded-3xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center">
                <span class="text-3xl">💰</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">FinSync Family</h1>
            <p class="text-sm text-slate-500 mt-1">Kelola Titipan Dana Keluarga</p>
        </div>

        <!-- Tab Switcher (Hanya muncul di Login/Register) -->
        <div id="tab-switcher" class="flex gap-2 mb-6">
            <button onclick="showLogin()" id="tab-login" class="tab-active flex-1 py-3 rounded-xl font-bold text-sm transition-all">Masuk</button>
            <button onclick="showRegister()" id="tab-register" class="tab-inactive flex-1 py-3 rounded-xl font-bold text-sm transition-all">Daftar</button>
        </div>

        <!-- Form Login -->
        <form id="form-login" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Email</label>
                <input type="email" id="login-email" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Password</label>
                <div class="relative mt-1">
                    <input type="password" id="login-password" required minlength="6" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 pr-12 outline-none focus:border-blue-500 transition-all">
                    <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors">
                        <!-- Icon Mata Tertutup -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
                <div class="text-right mt-2">
                    <button type="button" onclick="showForgotPassword()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold hover:underline">Lupa Password?</button>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">Masuk</button>
        </form>

        <!-- Form Register -->
        <form id="form-register" class="space-y-4 hidden">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Nama Lengkap</label>
                <input type="text" id="register-name" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Email</label>
                <input type="email" id="register-email" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Password (min. 6 karakter)</label>
                <div class="relative mt-1">
                    <input type="password" id="register-password" required minlength="6" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 pr-12 outline-none focus:border-blue-500 transition-all">
                    <button type="button" onclick="togglePassword('register-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">Daftar Akun</button>
        </form>

        <!-- Form Lupa Password -->
        <form id="form-forgot" class="space-y-4 hidden">
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-4">
                <p class="text-sm text-blue-800">📧 Masukkan email Anda, kami akan mengirimkan link untuk mengatur ulang password.</p>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Email</label>
                <input type="email" id="forgot-email" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 mt-1 outline-none focus:border-blue-500 transition-all">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">Kirim Link Reset</button>
            <button type="button" onclick="showLogin()" class="w-full text-slate-500 text-sm font-semibold hover:text-slate-700 py-2">← Kembali ke Login</button>
        </form>

        <!-- Pesan Error / Sukses -->
        <div id="error-message" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm text-center"></div>
        <div id="success-message" class="hidden mt-4 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-600 text-sm text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2rhK8et5UvZ5IEKRy21qjk3gRhc9-FUU",
            authDomain: "finsync-family.firebaseapp.com",
            projectId: "finsync-family",
            storageBucket: "finsync-family.firebasestorage.app",
            messagingSenderId: "363860293467",
            appId: "1:363860293467:web:81947477674fdeaa514c7e",
            databaseURL: "https://finsync-family-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- FUNGSI NAVIGASI FORM ---
        window.showLogin = () => {
            document.getElementById('form-login').classList.remove('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('form-forgot').classList.add('hidden');
            document.getElementById('tab-switcher').classList.remove('hidden');
            
            document.getElementById('tab-login').className = 'tab-active flex-1 py-3 rounded-xl font-bold text-sm transition-all';
            document.getElementById('tab-register').className = 'tab-inactive flex-1 py-3 rounded-xl font-bold text-sm transition-all';
            hideMessages();
        };

        window.showRegister = () => {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.remove('hidden');
            document.getElementById('form-forgot').classList.add('hidden');
            document.getElementById('tab-switcher').classList.remove('hidden');
            
            document.getElementById('tab-register').className = 'tab-active flex-1 py-3 rounded-xl font-bold text-sm transition-all';
            document.getElementById('tab-login').className = 'tab-inactive flex-1 py-3 rounded-xl font-bold text-sm transition-all';
            hideMessages();
        };

        window.showForgotPassword = () => {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('form-forgot').classList.remove('hidden');
            document.getElementById('tab-switcher').classList.add('hidden');
            hideMessages();
        };

        // --- FUNGSI LIHAT/SEMBUNYIKAN PASSWORD ---
        window.togglePassword = (inputId, btn) => {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                // Ganti ikon menjadi mata dicoret
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>`;
            } else {
                input.type = 'password';
                // Ganti ikon menjadi mata terbuka
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
            }
        };

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg; el.classList.remove('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }
        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg; el.classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
        }
        function hideMessages() {
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }

        // --- HANDLE LOGIN ---
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value.trim(), document.getElementById('login-password').value);
                window.location.href = 'index.html'; 
            } catch (error) {
                let msg = 'Login gagal.';
                if (error.code === 'auth/user-not-found') msg = 'Email tidak terdaftar. Silakan daftar terlebih dahulu.';
                else if (error.code === 'auth/wrong-password') msg = 'Password salah. Silakan periksa kembali atau gunakan fitur Lupa Password.';
                else if (error.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                showError(msg);
            }
        });

        // --- HANDLE REGISTER ---
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            try {
                const email = document.getElementById('register-email').value.trim();
                const password = document.getElementById('register-password').value;
                const name = document.getElementById('register-name').value.trim();

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                
                // Buat struktur data kosong untuk user baru
                await set(ref(db, `finSync/users/${userCredential.user.uid}/owners`), {});
                await set(ref(db, `finSync/users/${userCredential.user.uid}/transactions`), {});
                
                showSuccess('Akun berhasil dibuat! Silakan masuk.');
                setTimeout(() => showLogin(), 2500);
            } catch (error) {
                let msg = 'Pendaftaran gagal.';
                if (error.code === 'auth/email-already-in-use') msg = 'Email sudah terdaftar. Silakan gunakan email lain atau langsung login.';
                else if (error.code === 'auth/weak-password') msg = 'Password terlalu lemah. Minimal 6 karakter.';
                else if (error.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                showError(msg);
            }
        });

        // --- HANDLE LUPA PASSWORD ---
        document.getElementById('form-forgot').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            const email = document.getElementById('forgot-email').value.trim();
            
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess(`Link reset password telah dikirim ke ${email}. Silakan cek inbox atau folder spam Anda.`);
                setTimeout(() => showLogin(), 4000);
            } catch (error) {
                let msg = 'Gagal mengirim link reset.';
                if (error.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
                else if (error.code === 'auth/user-not-found') msg = 'Email ini tidak terdaftar di sistem kami.';
                else if (error.code === 'auth/too-many-requests') msg = 'Terlalu banyak permintaan. Coba lagi nanti.';
                showError(msg);
            }
        });
    </script>
</body>
</html>
